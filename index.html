<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日十词">
<title>每日十词</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow study column, like a notebook page; the word itself is the only big thing, highlighter yellow marks it in context. */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --sunk:#e8ecf6; --ink:#141b34; --muted:#5a6384; --line:#d6dcec;
  --accent:#2743c9; --on-accent:#ffffff; --mark:#ffe45c; --mark-ink:#141b34;
  --good:#12764a; --good-bg:#dff3e8; --bad:#bd3227; --bad-bg:#fbe3e0;
  --display:"Bricolage Grotesque","Inter","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1324; --surface:#181d33; --sunk:#222844; --ink:#e9ecf7; --muted:#9aa3c2; --line:#2e3558;
  --accent:#93a5ff; --on-accent:#0f1324; --mark:#e6cc45; --mark-ink:#141b34;
  --good:#63d49c; --good-bg:#143526; --bad:#ff8d83; --bad-bg:#40191a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1324; --surface:#181d33; --sunk:#222844; --ink:#e9ecf7; --muted:#9aa3c2; --line:#2e3558;
  --accent:#93a5ff; --on-accent:#0f1324; --mark:#e6cc45; --mark-ink:#141b34;
  --good:#63d49c; --good-bg:#143526; --bad:#ff8d83; --bad-bg:#40191a; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
a.btn{text-decoration:none;display:inline-block}
a{color:var(--accent)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font:700 26px/1.2 var(--display);margin:0;letter-spacing:.02em}
h1 span{background:var(--mark);color:var(--mark-ink);padding:0 .18em;border-radius:3px}
#stats{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#stats b{color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 15px var(--body);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--mark);color:var(--mark-ink);font-size:12px;line-height:18px;text-align:center}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font:600 17px/1.3 var(--body);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:72px}

/* word card */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:14px}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.known{color:var(--muted);text-decoration:line-through}
.card-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pic{flex:none;width:132px;height:132px;overflow:hidden;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-size:54px;line-height:1}
.word{font:700 clamp(30px,8vw,44px)/1.1 var(--display);margin:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.zh{font-size:18px;font-weight:600}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:grid;grid-template-columns:22px 1fr;gap:2px 6px}
.ex .k{color:var(--muted);font:500 13px/1.75 var(--mono)}
.ex .en{font-size:16px}
.ex .cn{grid-column:2;color:var(--muted);font-size:14px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.tip{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
.speak{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;line-height:1}

/* quiz + typing */
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opts .btn{text-align:left;padding:12px 14px}
.qword{font:700 34px/1.2 var(--display);overflow-wrap:anywhere}
.qsent{font-size:18px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink)}
.answer{font:500 18px var(--mono);width:100%}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)} .fb.ok strong{color:var(--good)}
.fb.no{background:var(--bad-bg)} .fb.no strong{color:var(--bad)}
.typer{font:400 19px/1.7 var(--mono);background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.typer .ok{color:var(--good)} .typer .bad{color:var(--bad);background:var(--bad-bg)} .typer .todo{color:var(--muted)}
.typer .cur{border-left:2px solid var(--accent);margin-left:-2px}

/* library */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item .w{font-weight:600} .item .m{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.st.due{background:var(--mark);color:var(--mark-ink)} .st.done{background:var(--good-bg);color:var(--good)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err{color:var(--bad)}
</style>

</head>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const addDays=(ds,n)=>{const a=ds.split('-').map(Number);return fmt(new Date(a[0],a[1]-1,a[2]+n))};
const slug=w=>String(w).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LV=['A1 入门','A2 基础','B1 中级','B2 中高级','C1 高级','C2 精通'];
const GAP=[1,2,4,7,15,30]; // days until next review after the n-th correct answer in a row

// Placement test: 5 words per level
const PT=[
 [0,'apple','苹果'],[0,'water','水'],[0,'happy','快乐的'],[0,'book','书'],[0,'run','跑'],
 [1,'weather','天气'],[1,'borrow','借（入）'],[1,'kitchen','厨房'],[1,'expensive','昂贵的'],[1,'journey','旅程'],
 [2,'improve','改善'],[2,'schedule','日程安排'],[2,'complain','抱怨'],[2,'opportunity','机会'],[2,'reliable','可靠的'],
 [3,'negotiate','谈判'],[3,'significant','重要的；显著的'],[3,'reluctant','不情愿的'],[3,'assess','评估'],[3,'consequence','后果'],
 [4,'meticulous','一丝不苟的'],[4,'alleviate','减轻；缓解'],[4,'ambiguous','模棱两可的'],[4,'scrutinize','仔细审查'],[4,'feasible','可行的'],
 [0,'friend','朋友'],[0,'door','门'],[0,'cold','冷的'],[0,'eat','吃'],[0,'family','家庭；家人'],
 [1,'neighbor','邻居'],[1,'forget','忘记'],[1,'healthy','健康的'],[1,'repair','修理'],[1,'appointment','预约'],
 [2,'recommend','推荐'],[2,'avoid','避免'],[2,'budget','预算'],[2,'postpone','推迟'],[2,'feedback','反馈'],
 [3,'acquire','获得'],[3,'substantial','大量的'],[3,'hesitate','犹豫'],[3,'outcome','结果'],[3,'abandon','放弃'],
 [4,'inevitable','不可避免的'],[4,'undermine','削弱'],[4,'coherent','连贯的'],[4,'deteriorate','恶化'],[4,'plausible','貌似合理的']
].sort((a,b)=>a[0]-b[0]);
const BANK=document.getElementById('bank').textContent.trim().split('\n').map(l=>{const a=l.split('|');
  return{lv:+a[0],cat:a[1]==='f'?'formal':'life',w:a[2],ipa:a[3],pos:a[4],zh:a[5],emoji:a[6],q:a[7],ex:[0,1,2].map(i=>({en:a[8+i*2],zh:a[9+i*2]})),tip:''}});
const DEF={level:null,days:{},known:[],pending:[],streak:0,lastDay:'',lifeN:5};
let S={meta:Object.assign({},DEF),words:{}};
const ui={tab:'today',idx:0,busy:null,prog:0,err:'',test:null,rev:null,
  prac:{set:'today',mode:'spell',i:0,ex:0,typed:'',hint:false,done:false,fb:null},lib:'all',open:null,del:null,ready:false,sync:'记录保存在这个浏览器里'};
let sample=null,tts=null,col=null;

/* ---------- storage: this browser first, then the viewer's private cloud rows ---------- */
const dirty=new Set();let flushing=false;
function persist(){
  const now=Date.now();
  for(const k of arguments){
    if(k==='meta')S.meta.upd=now;
    else if(S.words[k])S.words[k].upd=now;
    else{S.meta.gone=S.meta.gone||{};S.meta.gone[k]=now;S.meta.upd=now}
  }
  try{localStorage.setItem('d10',JSON.stringify(S))}catch(e){}
  queueSync();
}

/* ---------- sync between devices: one private GitHub Gist, newest change wins per word ---------- */
const SYNC_KEY='d10sync',SYNC_FILE='daily-ten-sync.json';
let syncCfg=null;try{syncCfg=JSON.parse(localStorage.getItem(SYNC_KEY))}catch(e){}
let syncTimer=null,syncing=false,syncAgain=false;
function setSync(m){ui.sync=m;document.querySelectorAll('.sync-st').forEach(el=>{el.textContent=m})}
function gh(path,opt){
  return fetch('https://api.github.com'+path,Object.assign({headers:{Authorization:'Bearer '+syncCfg.token,Accept:'application/vnd.github+json'}},opt||{}))
    .then(r=>{if(!r.ok)throw new Error('gh '+r.status);return r.json()});
}
function merge(remote){
  let changed=false;
  const gone=Object.assign({},remote.meta.gone||{}),lg=S.meta.gone||{};
  for(const k in lg)if(!(gone[k]>lg[k]))gone[k]=lg[k];
  for(const k in remote.words){const r=remote.words[k],l=S.words[k];if(!l||(r.upd||0)>(l.upd||0)){S.words[k]=r;changed=true}}
  if((remote.meta.upd||0)>(S.meta.upd||0)||(S.meta.level==null&&remote.meta.level!=null)){S.meta=Object.assign({},DEF,remote.meta);changed=true}
  S.meta.gone=gone;
  for(const k in gone)if(S.words[k]&&(S.words[k].upd||0)<gone[k]){delete S.words[k];changed=true}
  return changed;
}
async function syncNow(){
  if(!syncCfg||!syncCfg.token)return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('同步中…');
  try{
    if(S.meta.level!=null&&!S.meta.upd)S.meta.upd=1;
    if(!syncCfg.gist){
      const list=await gh('/gists?per_page=100');
      const g=list.find(x=>x.files&&x.files[SYNC_FILE]);
      if(g)syncCfg.gist=g.id;
      else{const f={};f[SYNC_FILE]={content:JSON.stringify(S)};
        syncCfg.gist=(await gh('/gists',{method:'POST',body:JSON.stringify({description:'每日十词 同步数据',public:false,files:f})})).id}
      localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg));
    }
    const g=await gh('/gists/'+syncCfg.gist),f=g.files[SYNC_FILE];
    let txt=f?f.content:'';
    if(f&&f.truncated)txt=await(await fetch(f.raw_url)).text();
    let remote=null;try{remote=JSON.parse(txt)}catch(e){}
    const changed=!!(remote&&remote.meta&&remote.words)&&merge(remote);
    const mine=JSON.stringify(S);
    if(mine!==txt){const u={};u[SYNC_FILE]={content:mine};await gh('/gists/'+syncCfg.gist,{method:'PATCH',body:JSON.stringify({files:u})})}
    try{localStorage.setItem('d10',mine)}catch(e){}
    const d=new Date();setSync('已同步 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));
    if(changed&&ui.ready&&!ui.rev&&!ui.test&&ui.tab!=='prac'&&!ui.busy)render();
  }catch(e){
    console.warn(e);
    const m=String(e&&e.message);
    if(/gh 404/.test(m)&&syncCfg.gist){delete syncCfg.gist;localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg))}
    setSync(/gh 40[13]/.test(m)?'同步失败：令牌无效或没有 gist 权限':'同步失败，稍后会重试');
  }
  syncing=false;
  if(syncAgain){syncAgain=false;queueSync()}
}
function queueSync(){if(!syncCfg||!syncCfg.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.ready)syncNow()});
function syncPanelHTML(){
  if(!ui.showSync)return'';

async function flush(){
  if(!col||flushing)return;flushing=true;
  while(dirty.size){
    const k=dirty.values().next().value;dirty.delete(k);
    try{
      if(k==='meta')await col.doc('meta').set(S.meta);
      else if(S.words[k])await col.doc('w-'+k).set(S.words[k]);
      else await col.doc('w-'+k).delete();
    }catch(e){dirty.add(k);ui.sync='同步失败，已存在本机';console.warn(e);break}
  }
  flushing=false;
}
const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);

  const caps=await Promise.all([use('db'),use('user'),use('sample'),use('tts')]);

        snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='meta')meta=v;else if(d.id.indexOf('w-')===0)words[d.id.slice(2)]=v});

}

function genDaily(){
  const t=today();ui.err='';
  const known=new Set(S.meta.known.map(slug));
  const free=BANK.filter(x=>!S.words[slug(x.w)]&&!known.has(slug(x.w)));

}
function finishDaily(items,t){

  Object.keys(m.days).sort().slice(0,-14).forEach(d=>delete m.days[d]);
  m.pending=m.pending.filter(w=>!S.words[slug(w)]);
  if(m.lastDay!==t){m.streak=m.lastDay===addDays(t,-1)?m.streak+1:1;m.lastDay=t}

async function tr(s){
  try{const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|zh-CN&q='+encodeURIComponent(s));
    const j=await r.json();return(j.responseData&&j.responseData.translatedText)||''}catch(e){return''}
}
async function lookup(word){
  const it={w:word,ipa:'',pos:'',zh:'',emoji:'📘',cat:'life',ex:[],tip:''};
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));
    if(r.ok){
      const j=await r.json(),e=j[0]||{};
      it.w=e.word||word;
      it.ipa=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
      it.pos=Array.from(new Set((e.meanings||[]).map(m=>m.partOfSpeech).filter(Boolean))).slice(0,2).join(' / ');
      let def='';
      j.forEach(en=>(en.meanings||[]).forEach(m=>(m.definitions||[]).forEach(x=>{
        if(!def&&x.definition)def=x.definition;
        if(x.example&&it.ex.length<3)it.ex.push({en:x.example,zh:''});
      })));
      if(def)it.tip='英文释义：'+def;
    }
  }catch(e){}
  it.zh=await tr(it.w);
  for(const e of it.ex)e.zh=await tr(e.en);
  if(!it.ex.length){it.ex.push({en:it.w,zh:it.zh});it.tip=(it.tip?it.tip+'　':'')+'词典里没有找到例句，可以在“打字练习 → 自己造句”里加上你自己的句子。'}
  return it;
}
async function addMine(text){
  const list=text.split(/[,，;；\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,10);
  if(!list.length||ui.busy)return;
  ui.err='';ui.busy='mine';render();
  const items=[];
  for(const w of list){if(S.words[slug(w)])continue;const it=await lookup(w);if(it.zh&&!S.words[slug(it.w)])items.push(it)}
  if(items.length){const fresh=addWords(items,'mine');ui.open=slug(items[0].w);persist.apply(null,fresh)}
  else ui.err='没有查到这些词，或者它们已经在词库里了。请检查拼写和网络。';
  ui.busy=null;render();
}

/* ---------- pictures: Wikipedia lead image, then Openverse search ---------- */
const ALT={},tried={};
async function wikiImg(q){
  const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=480&titles='+encodeURIComponent(q));
  const j=await r.json(),ps=(j.query&&j.query.pages)||{};
  for(const id in ps)if(ps[id].thumbnail)return ps[id].thumbnail.source;
  return'';
}
async function openverse(q){
  const r=await fetch('https://api.openverse.org/v1/images/?page_size=12&q='+encodeURIComponent(q));
  const j=await r.json();return(j.results||[]).map(x=>x.thumbnail||x.url).filter(Boolean);
}
async function commons(q){
  const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=480&gsrsearch='+encodeURIComponent(q+' filetype:bitmap'));
  const j=await r.json(),ps=(j.query&&j.query.pages)||{};
  return Object.keys(ps).map(id=>ps[id]).sort((a,b)=>a.index-b.index).map(p=>p.imageinfo&&p.imageinfo[0]&&p.imageinfo[0].thumburl).filter(Boolean);
}
async function loadAlts(k){
  const w=S.words[k];let list=[];
  if(!w.q){const u=await wikiImg(w.w).catch(()=>'');if(u)list.push(u)}
  list=list.concat(await commons(w.q||w.w).catch(()=>[]));
  if(list.length<4)list=list.concat(await openverse(w.q||w.w).catch(()=>[]));
  ALT[k]={list:list,i:-1};
}
function setImg(k,url){
  const w=S.words[k];if(!w)return;
  w.img=url;persist(k);
  document.querySelectorAll('[data-pic="'+k+'"]').forEach(el=>{el.innerHTML=url?'<img src="'+esc(url)+'" alt="" data-fail="'+k+'">':esc(w.emoji)});
}
async function nextImg(k){
  if(!S.words[k])return;
  if(!ALT[k])await loadAlts(k);
  const a=ALT[k];if(!a.list.length){if(S.words[k].img&&S.words[k].img.indexOf('data:')!==0)setImg(k,'');return}
  a.i++;if(a.i>=a.list.length){a.i=-1;if(a.fails>=a.list.length){setImg(k,'');return}a.i=0}

}
function autoImages(){

}
document.addEventListener('error',e=>{
  const k=e.target&&e.target.dataset&&e.target.dataset.fail;if(!k)return;
  if(!ALT[k]){setImg(k,'');delete tried[k];tried[k]=1;loadAlts(k).then(()=>nextImg(k));return}

  const k=ui.cardK;if(!k||!S.words[k]||!document.querySelector('[data-pic="'+k+'"]'))return;
  const f=Array.from((e.clipboardData&&e.clipboardData.files)||[]).find(x=>x.type.indexOf('image/')===0);
  if(!f)return;e.preventDefault();

    c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);setImg(k,c.toDataURL('image/jpeg',.8))};
  img.src=u;
});

/* ---------- matching the word inside a sentence ---------- */
function wordRe(w){
  const part=s=>{const stem=s.length>4?s.slice(0,-1):s;return stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"[\\w']*"};
  return new RegExp('\\b'+w.trim().split(/\s+/).map(part).join('\\s+'),'i');
}
function hl(sentence,w){
  const m=wordRe(w).exec(sentence);
  if(!m)return esc(sentence);
  return esc(sentence.slice(0,m.index))+'<mark>'+esc(m[0])+'</mark>'+esc(sentence.slice(m.index+m[0].length));
}

    '<div class="row"><input type="text" id="mine-in" data-enter="addMine" placeholder="例如：appointment, look forward to" style="flex:1 1 220px" autocomplete="off" autocapitalize="off" spellcheck="false">'+
    '<button class="btn primary" data-act="addMine"'+(ui.busy?' disabled':'')+'>添加</button></div>'+
    (ui.busy==='mine'?'<div class="row"><span class="spin"></span><span class="muted">正在查词典和翻译…</span></div>':'')+
    (ui.err?'<p class="err">'+esc(ui.err)+'</p>':'')+'</section>'+
    (mine.length?listHTML(mine):'<p class="muted">你还没有自己添加过词。看书、上班、刷视频时遇到的生词，都可以记在这里。</p>');
};

function listHTML(keys){
  return '<div class="list">'+keys.map(k=>{
    const w=S.words[k],st=statusOf(w);
    if(ui.open===k)return cardHTML(k,'<button class="btn" data-act="pracWord" data-k="'+k+'">打字练习</button><button class="btn ghost" data-act="open" data-k="">收起</button>'+
      (ui.del===k?'<button class="btn danger" data-act="del" data-k="'+k+'">确认删除</button>':'<button class="btn ghost danger" data-act="askDel" data-k="'+k+'">删除</button>'));
    return '<button class="item" data-act="open" data-k="'+k+'"><span aria-hidden="true">'+esc(w.emoji)+'</span><span style="min-width:0"><span class="w">'+esc(w.w)+'</span><span class="m" style="display:block">'+esc(w.zh)+'</span></span><span class="st '+st[0]+'">'+st[1]+'</span></button>';
  }).join('')+'</div>';
}
V.lib=function(){
  const t=today(),F={all:['全部',()=>true],push:['每日推送',w=>w.src!=='mine'],mine:['我输入的',w=>w.src==='mine'],due:['待复习',w=>w.due<=t],done:['已掌握',w=>w.box>=5]};
  const keys=all().filter(k=>F[ui.lib][1](S.words[k])).sort((a,b)=>S.words[a].added<S.words[b].added?1:(S.words[a].added>S.words[b].added?-1:0));
  return '<div class="chips">'+Object.keys(F).map(f=>'<button class="chip" data-act="lib" data-f="'+f+'" aria-current="'+(f===ui.lib)+'">'+F[f][0]+' '+all().filter(k=>F[f][1](S.words[k])).length+'</button>').join('')+'</div>'+
    (keys.length?listHTML(keys):'<p class="muted">这里还没有词。</p>');
};

/* review */
function makeQ(k,retry){
  const w=S.words[k];
  let type=retry?'spell':(w.box===0?'mc':(Math.random()<.5?'cloze':'spell'));
  const q={k:k,type:type,done:null};
  if(type==='cloze'){
    const re=wordRe(w.w),c=shuffle(w.ex).find(e=>re.test(e.en));
    if(c){const m=re.exec(c.en);q.ex=c;q.pre=c.en.slice(0,m.index);q.post=c.en.slice(m.index+m[0].length);q.ans=m[0]}else q.type='spell';
  }
  if(q.type==='mc'){
    const pool=Array.from(new Set(all().filter(x=>x!==k).map(x=>S.words[x].zh).concat(PT.map(x=>x[2])))).filter(z=>z!==w.zh);
    q.opts=shuffle([w.zh].concat(shuffle(pool).slice(0,3)));
  }
  return q;
}
function startReview(free){
  let q=dueList().slice(0,20);
  if(free)q=shuffle(all()).slice(0,10);
  if(!q.length)return;
  ui.rev={q:q,n0:q.length,i:0,retried:[],right:0,missed:[],cur:null};
  ui.rev.cur=makeQ(q[0],false);render();
}
function grade(ok,given){
  const r=ui.rev,q=r.cur,w=S.words[q.k],t=today(),retry=r.retried.indexOf(q.k)>=0;
  q.done={ok:ok,given:given};
  if(!retry){
    if(ok){r.right++;if(w.due<=t){w.box=Math.min(w.box+1,6);w.due=addDays(t,GAP[w.box-1])}}
    else fail(q.k);
    persist(q.k);
  }
  render();
}
function fail(k){ // not understood yet: back to the start, and it stays due so the next test asks it again
  const r=ui.rev,w=S.words[k];
  w.box=0;w.due=today();w.lapses=(w.lapses||0)+1;
  if(r.retried.indexOf(k)<0){r.retried.push(k);r.q.push(k);r.missed.push(k)}
}
function nextQ(){
  const r=ui.rev;r.i++;
  r.cur=r.i<r.q.length?makeQ(r.q[r.i],r.i>=r.n0):null;
  render();
}
V.review=function(){
  const r=ui.rev,due=dueList();
  if(!r){
    if(!all().length)return '<p class="muted">词库还是空的。先在“今日推送”学今天的词，或在“我的单词”里添加。</p>';
    return '<section class="panel"><h2>'+(due.length?'有 '+due.length+' 个词等你复习':'现在没有到期要复习的词')+'</h2>'+
      '<p class="muted">答对的词会隔 1、2、4、7、15、30 天再出现。答错或你觉得还没理解的词，会从头开始，并在下一次测试里再考一次。</p>'+
      '<div class="row">'+(due.length?'<button class="btn primary" data-act="startReview">开始复习'+(due.length>20?'（先做 20 个）':'')+'</button>':'')+
      '<button class="btn" data-act="freeReview">随机抽 10 个测一测</button></div></section>';
  }
  if(!r.cur){
    const first=r.q.length-r.retried.length;
    return '<section class="panel"><h2>这一轮完成了</h2><p>第一次就答对 <b>'+r.right+'</b> / '+first+'。</p>'+
      (r.missed.length?'<p>这些词还不牢，下一次测试会再出现：</p><div class="chips">'+r.missed.map(k=>S.words[k]?'<span class="chip">'+esc(S.words[k].emoji)+' '+esc(S.words[k].w)+'</span>':'').join('')+'</div>':'<p class="muted">全部答对，没有需要重测的词。</p>')+
      '<div class="row"><button class="btn primary" data-act="endReview">好的</button>'+(r.missed.length?'<button class="btn" data-act="pracMissed">用打字练这几个词</button>':'')+'</div></section>';
  }
  const q=r.cur,w=S.words[q.k];
  let body='';
  if(q.type==='mc')body='<p class="qword">'+esc(w.w)+' <button class="speak" data-act="speak" data-t="'+esc(w.w)+'" aria-label="朗读">🔊</button></p><p class="muted">它是什么意思？</p>'+
    (q.done?'':'<div class="opts">'+q.opts.map(o=>'<button class="btn" data-act="mc" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>');
  else if(q.type==='cloze')body='<p class="muted">填上缺少的词（'+esc(w.zh)+'）</p><p class="qsent">'+esc(q.pre)+'<span class="blank"></span>'+esc(q.post)+'</p><p class="muted small">'+esc(q.ex.zh)+'</p>';
  else body='<div class="card-top">'+picHTML(q.k)+'<div><p class="zh">'+esc(w.zh)+'</p><p class="muted">'+esc(w.pos)+' · 用英语怎么说？</p></div></div>';
  if(!q.done&&q.type!=='mc')body+='<div class="row"><input type="text" class="answer" id="rev-in" data-focus data-enter="revAns" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1 1 200px" aria-label="你的答案"><button class="btn primary" data-act="revAns">确定</button></div>';
  if(!q.done)body+='<div class="row"><button class="btn ghost" data-act="dunno">不知道</button></div>';
  else{
    const d=q.done;
    body+='<div class="fb '+(d.ok?'ok':'no')+'"><strong>'+(d.ok?'✓ 答对了':'✗ 还不对'+(d.given?'，你的答案：'+esc(d.given):''))+'</strong>'+
      '<div>'+esc(w.emoji)+' <b>'+esc(w.w)+'</b> '+esc(w.ipa)+' · '+esc(w.zh)+'</div>'+
      '<div class="small">'+hl(w.ex[0].en,w.w)+'<br><span class="muted">'+esc(w.ex[0].zh)+'</span></div>'+
      (d.ok?'':'<div class="small">这个词会在下一次测试里再出现。</div>')+'</div>'+
      '<div class="row"><button class="btn primary" data-act="nextQ" data-focus>下一个</button>'+
      (d.ok&&!d.undone?'<button class="btn ghost" data-act="unsure">其实我还没理解这个词</button>':'')+
      (d.undone?'<span class="muted small">已记下，下次测试再考你。</span>':'')+'</div>';
  }
  return '<section class="panel"><div class="row spread"><h2>复习</h2><span class="muted small">'+(r.i+1)+' / '+r.q.length+'</span></div>'+
    '<div class="bar"><i style="width:'+(r.i/r.q.length*100)+'%"></i></div>'+body+'</section>';
};

/* typing practice */
function pracKeys(){
  const p=ui.prac;
  if(p.custom)return p.custom.filter(k=>S.words[k]);
  if(p.set==='today')return todayList();
  if(p.set==='due')return dueList();
  if(p.set==='mine')return all().filter(k=>S.words[k].src==='mine');
  return all();
}
function typerHTML(target,typed,hide){
  let h='';
  for(let i=0;i<target.length;i++){
    const c=target[i];
    if(i<typed.length)h+='<span class="'+(norm(typed[i])===norm(c)||(/\s/.test(c)&&/\s/.test(typed[i]))?'ok':'bad')+'">'+esc(c===' '&&norm(typed[i])!==''&&typed[i]!==' '?'␣':c)+'</span>';
    else h+='<span class="todo'+(i===typed.length?' cur':'')+'">'+(hide&&c!==' '?'·':esc(c))+'</span>';
  }
  return h;
}
function pracTarget(){
  const keys=pracKeys(),p=ui.prac;if(!keys.length)return null;
  p.i=((p.i%keys.length)+keys.length)%keys.length;
  const w=S.words[keys[p.i]];
  return {w:w,n:keys.length,target:p.mode==='copy'?w.ex[p.ex%w.ex.length].en:w.w};
}
V.prac=function(){
  const p=ui.prac,t=pracTarget();
  const head='<div class="row"><label for="prac-set" class="muted small">练哪些词</label><select id="prac-set" data-change="pracSet">'+
    [['today','今天的词'],['due','待复习的词'],['mine','我输入的词'],['all','全部']].map(o=>'<option value="'+o[0]+'"'+(!p.custom&&p.set===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
    (p.custom?'<option selected>指定的词</option>':'')+'</select></div>'+
    '<div class="chips">'+[['spell','拼写单词'],['copy','抄写例句'],['make','自己造句']].map(m=>'<button class="chip" data-act="pracMode" data-m="'+m[0]+'" aria-current="'+(p.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>';
  if(!t)return head+'<p class="muted">这一组里还没有词。换一组，或先去学今天的词。</p>';
  const w=t.w;
  let body='<div class="row spread"><div class="row"><span style="font-size:28px" role="img" aria-label="'+esc(w.zh)+'">'+esc(w.emoji)+'</span><span class="zh">'+esc(w.zh)+'</span><span class="muted">'+esc(w.pos)+'</span>'+
    '<button class="speak" data-act="speak" data-t="'+esc(p.mode==='copy'?t.target:w.w)+'" aria-label="朗读">🔊</button></div><span class="muted small">'+(p.i+1)+' / '+t.n+'</span></div>';
  if(p.mode==='make'){
    body+='<p>用 <mark>'+esc(w.w)+'</mark> 写一个你自己的句子，保存后会出现在这个词的卡片上。</p>'+
      '<textarea id="make-in" data-focus spellcheck="false" aria-label="你的句子" placeholder="'+esc(w.ex[0].en)+'">'+esc(p.typed)+'</textarea>'+
      '<div class="row"><button class="btn primary" data-act="checkMake"'+(ui.busy?' disabled':'')+'>保存我的句子</button><button class="btn" data-act="pracNext">下一个词</button>'+
      (ui.busy==='make'?'<span class="spin"></span>':'')+'</div>';
    if(p.fb)body+=p.fb.err?'<p class="err">'+esc(p.fb.err)+'</p>':'<div class="fb '+(p.fb.ok?'ok':'no')+'"><strong>'+(p.fb.ok?'✓ 已保存到单词卡':'需要改一改')+'</strong>'+
      (p.fb.ok?'':'<div>改正：'+esc(p.fb.corrected)+'</div>')+(p.fb.better?'<div>更自然的说法：'+esc(p.fb.better)+'</div>':'')+'<div class="small">'+esc(p.fb.comment)+'</div></div>';
  }else{
    const hide=p.mode==='spell'&&!p.hint;
    body+=(p.mode==='copy'?'<p class="muted small">'+esc(w.ex[p.ex%w.ex.length].zh)+'</p>':'')+
      '<div class="typer" id="typer-out" aria-hidden="true">'+typerHTML(t.target,p.typed,hide)+'</div>'+
      '<input type="text" class="answer" id="typer-in" data-focus value="'+esc(p.typed)+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="在这里打字" placeholder="在这里打字，回车进入下一个">'+
      '<p id="typer-done" class="fb ok"'+(p.done?'':' hidden')+'><strong>✓ 完全正确</strong></p>'+
      '<div class="row"><button class="btn primary" data-act="pracNext">'+(p.mode==='copy'?'下一句':'下一个词')+'</button>'+
      (p.mode==='spell'&&!p.hint?'<button class="btn ghost" data-act="hint">看一眼答案</button>':'')+
      (p.mode==='copy'?'<button class="btn ghost" data-act="pracSkipWord">换下一个词</button>':'')+'</div>';
  }
  return head+'<section class="panel">'+body+'</section>';
};
function resetPrac(){const p=ui.prac;p.typed='';p.hint=false;p.done=false;p.fb=null}
function pracNext(){
  const p=ui.prac,t=pracTarget();
  if(p.mode==='copy'&&t&&p.ex%t.w.ex.length<t.w.ex.length-1)p.ex++;
  else{p.ex=0;p.i++}
  resetPrac();render();
}
function checkMake(){
  const p=ui.prac,t=pracTarget(),el=$('#make-in');if(!t||!el)return;
  const v=el.value.trim();if(!v)return;p.typed=v;
  if(!wordRe(t.w.w).test(v)){p.fb={err:'句子里还没有用到 '+t.w.w+'。'};render();return}
  t.w.mine=(t.w.mine||[]).concat(v).slice(-5);persist(slug(t.w.w));
  p.typed='';p.fb={ok:true};render();
}

/* ---------- render + events ---------- */
const TABS=[['today','今日推送'],['mine','我的单词'],['review','复习'],['prac','打字练习'],['lib','词库']];
function render(){
  const due=dueList().length,m=S.meta;
  $('#stats').innerHTML=(m.level!=null?'等级 <b>'+LV[m.level]+'</b> · ':'')+'连续 <b>'+m.streak+'</b> 天 · 词库 <b>'+all().length+'</b> · 已掌握 <b>'+all().filter(k=>S.words[k].box>=5).length+'</b>';
  $('#tabs').innerHTML=TABS.map(t=>'<button data-act="tab" data-tab="'+t[0]+'" aria-current="'+(ui.tab===t[0])+'">'+t[1]+(t[0]==='review'&&due?'<span class="n">'+due+'</span>':'')+'</button>').join('');
  $('#view').innerHTML=V[ui.tab]();
  autoImages();
  const f=$('#view [data-focus]');
  if(f){f.focus({preventScroll:true});if(f.setSelectionRange&&f.type==='text'){const n=f.value.length;f.setSelectionRange(n,n)}}
}
const A={
  tab(d){ui.tab=d.tab;ui.err='';ui.open=null;ui.del=null;render()},
  go(d){ui.idx=+d.i;render()},prev(){ui.idx--;render()},next(){ui.idx++;render()},
  speak(d){speak(d.t)},
  know(d){const w=S.words[d.k];w.box=5;w.due=addDays(today(),15);if(S.meta.known.indexOf(w.w)<0)S.meta.known.push(w.w);persist(d.k,'meta');render()},
  genDaily(){genDaily()},
  startTest(){startTest()},
  skipTest(){S.meta.level=0;persist('meta');render();ensureToday()},
  retest(){startTest()},
  testAns(d){testAnswer(d.v)},
  addMine(){const el=$('#mine-in');if(el)addMine(el.value)},
  open(d){ui.open=d.k||null;ui.del=null;render()},
  askDel(d){ui.del=d.k;render()},
  del(d){delete S.words[d.k];ui.open=null;ui.del=null;persist(d.k);render()},
  lib(d){ui.lib=d.f;ui.open=null;render()},
  startReview(){startReview(false)},freeReview(){startReview(true)},
  endReview(){ui.rev=null;render()},
  mc(d){grade(d.v===S.words[ui.rev.cur.k].zh,d.v)},
  revAns(){const el=$('#rev-in');if(!el||!el.value.trim())return;const q=ui.rev.cur,w=S.words[q.k],v=norm(el.value);
    grade(v===norm(w.w)||(q.ans&&v===norm(q.ans)),el.value.trim())},
  dunno(){grade(false,'')},
  unsure(){const r=ui.rev,q=r.cur;if(r.retried.indexOf(q.k)<0)r.right--;fail(q.k);q.done.undone=true;persist(q.k);render()},
  nextQ(){nextQ()},
  pracMissed(){const p=ui.prac;p.custom=ui.rev.missed.slice();p.i=0;p.ex=0;p.mode='spell';resetPrac();ui.rev=null;ui.tab='prac';render()},
  pracWord(d){const p=ui.prac;p.custom=[d.k];p.i=0;p.ex=0;p.mode='copy';resetPrac();ui.tab='prac';render()},
  pracMode(d){ui.prac.mode=d.m;ui.prac.ex=0;resetPrac();render()},
  pracNext(){pracNext()},
  pracSkipWord(){ui.prac.ex=0;ui.prac.i++;resetPrac();render()},
  hint(){ui.prac.hint=true;render()},
  checkMake(){checkMake()},
  nextImg(d){nextImg(d.k)},
  toggleSync(){ui.showSync=!ui.showSync;render()},
  saveSync(){const el=$('#sync-token'),v=el&&el.value.trim();if(!v)return;
    syncCfg={token:v};try{localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg))}catch(e){}
    ui.showSync=false;render();syncNow().then(()=>{if(!ui.rev&&!ui.test){render();ensureToday()}})},
  syncNow(){syncNow()},
  stopSync(){syncCfg=null;try{localStorage.removeItem(SYNC_KEY)}catch(e){}setSync('同步已关闭');render()},
  exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='daily-ten-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()},
  importData(){const el=$('#imp');if(el)el.click()}
};
document.addEventListener('change',e=>{
  if(e.target.id!=='imp'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{const l=JSON.parse(fr.result);if(!l.meta||!l.words)throw 0;S={meta:Object.assign({},DEF,l.meta),words:l.words};persist();ui.sync='已导入备份';render()}catch(x){ui.sync='这个文件不是有效的备份';render()}};
  fr.readAsText(e.target.files[0]);
});
const C={
  level(v){S.meta.level=+v;persist('meta');render()},
  ratio(v){S.meta.lifeN=+v;persist('meta')},
  pracSet(v){const p=ui.prac;p.custom=null;p.set=v;p.i=0;p.ex=0;resetPrac();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&A[b.dataset.act])A[b.dataset.act](b.dataset)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&C[k])C[k](e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const el=e.target;
  if(el.id==='typer-in'){e.preventDefault();pracNext();return}
  const k=el.dataset&&el.dataset.enter;if(k&&A[k]){e.preventDefault();A[k]({})}
});
document.addEventListener('input',e=>{
  const el=e.target,p=ui.prac;
  if(el.id==='typer-in'){
    const t=pracTarget();if(!t)return;
    p.typed=el.value;
    $('#typer-out').innerHTML=typerHTML(t.target,p.typed,p.mode==='spell'&&!p.hint);
    p.done=norm(p.typed)===norm(t.target);
    $('#typer-done').hidden=!p.done;
  }else if(el.id==='make-in')p.typed=el.value;
});
boot();
})();
</script>
