<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日十词">
<title>每日十词</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow study column, like a notebook page; the word itself is the only big thing, highlighter yellow marks it in context. */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --sunk:#e8ecf6; --ink:#141b34; --muted:#5a6384; --line:#d6dcec;
  --accent:#2743c9; --on-accent:#ffffff; --mark:#ffe45c; --mark-ink:#141b34;
  --good:#12764a; --good-bg:#dff3e8; --bad:#bd3227; --bad-bg:#fbe3e0;
  --display:"Bricolage Grotesque","Inter","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1324; --surface:#181d33; --sunk:#222844; --ink:#e9ecf7; --muted:#9aa3c2; --line:#2e3558;
  --accent:#93a5ff; --on-accent:#0f1324; --mark:#e6cc45; --mark-ink:#141b34;
  --good:#63d49c; --good-bg:#143526; --bad:#ff8d83; --bad-bg:#40191a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1324; --surface:#181d33; --sunk:#222844; --ink:#e9ecf7; --muted:#9aa3c2; --line:#2e3558;
  --accent:#93a5ff; --on-accent:#0f1324; --mark:#e6cc45; --mark-ink:#141b34;
  --good:#63d49c; --good-bg:#143526; --bad:#ff8d83; --bad-bg:#40191a; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
a.btn{text-decoration:none;display:inline-block}
a{color:var(--accent)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html,body{overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0;max-width:100%}
#syncbar{display:flex;flex-direction:column;gap:10px}
#syncbar .sb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
#syncbar .sb.warn{border-color:var(--mark);color:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font:700 26px/1.2 var(--display);margin:0;letter-spacing:.02em}
h1 span{background:var(--mark);color:var(--mark-ink);padding:0 .18em;border-radius:3px}
#stats{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#stats b{color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 15px var(--body);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--mark);color:var(--mark-ink);font-size:12px;line-height:18px;text-align:center}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font:600 17px/1.3 var(--body);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:72px}

/* word card */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:14px}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.known{color:var(--muted);text-decoration:line-through}
.card-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pic{flex:none;width:132px;height:132px;overflow:hidden;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-size:54px;line-height:1}
.word{font:700 clamp(30px,8vw,44px)/1.1 var(--display);margin:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.zh{font-size:18px;font-weight:600}
.rel{display:flex;flex-direction:column;gap:6px}
.rel p{margin:0}
.rel .more{font-weight:600}
.rel .rl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rel input{width:100%}
.chip.dim{opacity:.55}
.ccats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ccat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit}
.ccat .e{font-size:26px;line-height:1.2}.ccat .t{font-weight:600;font-size:16px}
.ptwrap{overflow-x:auto;padding-bottom:4px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(32px,1fr));grid-auto-rows:38px;gap:2px;min-width:612px}
.el{border:1px solid var(--line);background:none;color:var(--ink);border-radius:5px;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font:inherit}
.el i{font-style:normal;font-size:8px;color:var(--muted)}.el b{font-size:13px}
.el.nm{background:color-mix(in srgb,var(--accent) 14%,transparent)}.el.ng{background:color-mix(in srgb,var(--mark) 22%,transparent)}.el.f{border-style:dashed}
.el.got{border-color:var(--accent)}.el[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.elbig{display:grid;place-items:center;width:84px;height:84px;border-radius:14px;background:var(--sunk);font-size:38px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chipbox{background:var(--sunk);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.chipbox p{margin:0}
.defs .cnl{margin:0;font-size:15px}
.defs{display:flex;flex-direction:column;gap:6px}
.defs .pos{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.defs ol{margin:0;padding-left:1.4em;font-size:14px}
.defs li .cn{display:block;color:var(--muted)}
.defs .btn.small{padding:0 6px;font-size:12px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;padding:2px 10px;border-radius:999px;cursor:pointer}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:grid;grid-template-columns:22px 1fr;gap:2px 6px}
.ex .k{color:var(--muted);font:500 13px/1.75 var(--mono)}
.ex .en{font-size:16px}
.ex .cn{grid-column:2;color:var(--muted);font-size:14px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.tip{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
.speak{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;line-height:1}

/* quiz + typing */
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opts .btn{text-align:left;padding:12px 14px}
.qword{font:700 34px/1.2 var(--display);overflow-wrap:anywhere}
.qsent{font-size:18px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink)}
.answer{font:500 18px var(--mono);width:100%}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)} .fb.ok strong{color:var(--good)}
.fb.no{background:var(--bad-bg)} .fb.no strong{color:var(--bad)}
.typer{font:400 19px/1.7 var(--mono);background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.typer .ok{color:var(--good)} .typer .bad{color:var(--bad);background:var(--bad-bg)} .typer .todo{color:var(--muted)}
.typer .cur{border-left:2px solid var(--accent);margin-left:-2px}

/* library */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item .w{font-weight:600} .item .m{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.st.due{background:var(--mark);color:var(--mark-ink)} .st.done{background:var(--good-bg);color:var(--good)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err{color:var(--bad)}
</style>

</head>

<div class="wrap">
  <header>
    <h1><span>每日十词</span></h1>
    <div id="stats"></div>
  </header>
  <div id="syncbar"></div>
  <nav id="tabs" aria-label="功能"></nav>
  <main id="view"><p class="muted">加载中…</p></main>
</div>

<script type="text/plain" id="chem">
equip|beaker|||n.|烧杯|🧪||最常用的玻璃容器，用来盛放、混合或加热溶液。|Pour the solution into a clean beaker.|把溶液倒进一个干净的烧杯里。|The beaker holds 100 mL of water.|这个烧杯能装 100 毫升水。|I rinsed the beaker with deionized water.|我用去离子水冲洗了烧杯。
equip|volumetric flask|||n.|容量瓶|🧪||用来配制准确浓度的溶液，瓶颈上有一条刻度线。|Use a volumetric flask to prepare the standard solution.|用容量瓶配制标准溶液。|Fill the volumetric flask up to the mark.|把容量瓶加到刻度线。|A 250 mL volumetric flask is on the bench.|实验台上有一个 250 毫升的容量瓶。
equip|pipette|||n.|移液管；移液枪|💧||用来准确移取少量液体；动词也可以说 pipette 20 µL。|Use a pipette to add 20 µL of ink.|用移液枪加 20 微升墨水。|The pipette tip must be changed each time.|每次都要换移液枪头。|She dropped the catalyst ink with a pipette.|她用移液枪滴加催化剂墨水。
equip|crucible|||n.|坩埚|🏺||耐高温的小容器，煅烧样品时用。|Put the powder into a ceramic crucible.|把粉末放进陶瓷坩埚里。|The crucible was heated to 500 °C.|坩埚被加热到 500 摄氏度。|Cover the crucible with a lid.|给坩埚盖上盖子。
equip|tube furnace|||n.|管式炉|🔥||在可控气氛下高温处理样品的炉子。|The sample was annealed in a tube furnace.|样品在管式炉里退火。|Set the tube furnace to 450 °C.|把管式炉设到 450 摄氏度。|Argon flows through the tube furnace.|氩气流过管式炉。
equip|fume hood|||n.|通风橱|🌬️||处理有毒或有挥发性的试剂时必须在里面操作。|Always handle acids in the fume hood.|处理酸一定要在通风橱里。|The fume hood is not working today.|通风橱今天坏了。|Keep the fume hood sash low.|把通风橱的玻璃门拉低。
equip|glovebox|||n.|手套箱|🧤||充满惰性气体的密封箱，用来处理怕水怕氧的材料。|The cell was assembled in a glovebox.|电池是在手套箱里组装的。|The glovebox is filled with argon.|手套箱里充满了氩气。|Check the oxygen level in the glovebox.|检查手套箱里的氧含量。
equip|potentiostat|||n.|恒电位仪；电化学工作站|🎛️||电化学测试的核心仪器，控制电位并测量电流。|Connect the electrodes to the potentiostat.|把电极接到恒电位仪上。|The potentiostat records the current.|恒电位仪记录电流。|Our lab has a new potentiostat.|我们实验室有一台新的电化学工作站。
equip|working electrode|WE||n.|工作电极|⚡||发生你要研究的反应的那个电极，缩写 WE。|The catalyst was loaded on the working electrode.|催化剂负载在工作电极上。|The working electrode is a glassy carbon disk.|工作电极是玻碳圆盘。|Polish the working electrode before each test.|每次测试前打磨工作电极。
equip|counter electrode|CE||n.|对电极|⚡||和工作电极构成回路的电极，常用铂丝或碳棒，缩写 CE。|A platinum wire was used as the counter electrode.|用铂丝作对电极。|The counter electrode completes the circuit.|对电极使电路闭合。|Keep the counter electrode away from the sample.|让对电极离样品远一点。
equip|reference electrode|RE||n.|参比电极|📏|reference electrode Ag/AgCl|提供稳定电位基准的电极，如 Ag/AgCl、SCE，缩写 RE。|An Ag/AgCl reference electrode was used.|使用了 Ag/AgCl 参比电极。|Store the reference electrode in KCl solution.|把参比电极保存在氯化钾溶液里。|The reference electrode gives a stable potential.|参比电极提供稳定的电位。
equip|electrochemical cell|||n.|电化学池；电解池|🔋||装电解液和电极、进行电化学测试的容器。|A three-electrode electrochemical cell was used.|使用了三电极电化学池。|Fill the electrochemical cell with electrolyte.|往电化学池里加电解液。|The electrochemical cell has a quartz window.|这个电化学池有一个石英窗口。
equip|centrifuge|||n.|离心机|🌀||靠高速旋转把固体和液体分开；也可以作动词。|Put the tubes into the centrifuge.|把离心管放进离心机。|The centrifuge runs at 8000 rpm.|离心机转速为 8000 转每分钟。|Balance the centrifuge before you start.|开始前给离心机配平。
equip|autoclave|||n.|高压反应釜|🫙|hydrothermal autoclave reactor|水热合成用的密封耐压容器，通常有聚四氟乙烯内衬。|The solution was sealed in an autoclave.|溶液被密封在反应釜里。|Heat the autoclave at 180 °C for 12 hours.|把反应釜在 180 摄氏度加热 12 小时。|Let the autoclave cool down naturally.|让反应釜自然冷却。
test|linear sweep voltammetry|LSV||n.|线性扫描伏安法|📈||电位朝一个方向匀速扫描，记录电流；测催化活性最常用。|Linear sweep voltammetry was used to measure the activity.|用线性扫描伏安法测量活性。|The linear sweep voltammetry curve shows a low onset potential.|线性扫描伏安曲线显示起始电位很低。|We ran linear sweep voltammetry at 5 mV/s.|我们以 5 毫伏每秒进行线性扫描伏安测试。
test|cyclic voltammetry|CV||n.|循环伏安法|🔁||电位来回扫描，可以看氧化还原峰和可逆性。|Cyclic voltammetry shows two redox peaks.|循环伏安显示两个氧化还原峰。|We used cyclic voltammetry to activate the electrode.|我们用循环伏安法活化电极。|The cyclic voltammetry scan rate was 50 mV/s.|循环伏安的扫速是 50 毫伏每秒。
test|electrochemical impedance spectroscopy|EIS||n.|电化学阻抗谱|〰️||施加小幅交流信号测阻抗，用来分析电荷转移电阻等。|Electrochemical impedance spectroscopy was measured at 1.5 V.|在 1.5 伏下测量了电化学阻抗谱。|Electrochemical impedance spectroscopy shows a small charge transfer resistance.|电化学阻抗谱显示电荷转移电阻很小。|We fitted the electrochemical impedance spectroscopy data with a circuit model.|我们用等效电路模型拟合了阻抗谱数据。
test|chronoamperometry|CA||n.|计时电流法|⏱️||固定电位，记录电流随时间的变化；常用来测稳定性。|Chronoamperometry was used to test the stability.|用计时电流法测试稳定性。|The chronoamperometry curve stayed flat for 20 hours.|计时电流曲线 20 小时保持平稳。|We ran chronoamperometry at a fixed potential.|我们在固定电位下做了计时电流测试。
test|chronopotentiometry|CP||n.|计时电位法|⏱️||固定电流，记录电位随时间的变化。|Chronopotentiometry was performed at 10 mA per square centimeter.|在 10 毫安每平方厘米下进行了计时电位测试。|The chronopotentiometry test lasted 50 hours.|计时电位测试持续了 50 小时。|Chronopotentiometry shows a stable potential.|计时电位法显示电位稳定。
test|Mott-Schottky analysis|M-S||n.|莫特-肖特基分析|📉|Mott–Schottky plot|通过电容随电位的变化，得到平带电位和载流子浓度；PEC 常用。|Mott-Schottky analysis gives the flat band potential.|莫特-肖特基分析可以得到平带电位。|The Mott-Schottky analysis shows n-type behavior.|莫特-肖特基分析显示为 n 型行为。|We did Mott-Schottky analysis in the dark.|我们在暗态下做了莫特-肖特基分析。
test|mass spectrometry|MS||n.|质谱法|⚖️||按质荷比分离离子，用来鉴定产物或气体成分。|Mass spectrometry was used to detect the gas products.|用质谱法检测气体产物。|The mass spectrometry signal of oxygen increased.|氧气的质谱信号增强了。|Online mass spectrometry confirms hydrogen evolution.|在线质谱证实有氢气析出。
test|X-ray diffraction|XRD||n.|X 射线衍射|💎||用来确定晶体结构和物相。|X-ray diffraction confirms the crystal phase.|X 射线衍射确认了晶相。|The X-ray diffraction pattern has sharp peaks.|X 射线衍射图谱有尖锐的峰。|No impurity was found by X-ray diffraction.|X 射线衍射没有发现杂质。
test|X-ray photoelectron spectroscopy|XPS||n.|X 射线光电子能谱|🔬||分析表面元素组成和化学价态。|X-ray photoelectron spectroscopy shows the oxidation state of nickel.|X 射线光电子能谱显示了镍的价态。|We used X-ray photoelectron spectroscopy to study the surface.|我们用 X 射线光电子能谱研究表面。|The X-ray photoelectron spectroscopy peak shifted to higher energy.|X 射线光电子能谱的峰向高能方向移动。

function speak(text){
  text=String(text||'').trim();if(!text)return;
  const n=++speakN,q=encodeURIComponent(text);
  const yd='https://dict.youdao.com/dictvoice?type=2&audio='+q,bd='https://fanyi.baidu.com/gettts?lan=en&spd=3&source=web&text='+q;
  const urls=/\s/.test(text)?[bd,yd]:[yd,bd];
  try{speechSynthesis.cancel()}catch(e){}
  let i=0;
  const next=()=>{
    if(n!==speakN)return;
    if(i>=urls.length){speakTTS(text);return}
    player.onerror=next;player.src=urls[i++];
    const p=player.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name!=='AbortError')next()});
  };
  next();

/* ---------- matching the word inside a sentence ---------- */
function wordRe(w){
  const part=s=>{const stem=s.length>4?s.slice(0,-1):s;return stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"[\\w']*"};
  return new RegExp('\\b'+w.trim().split(/\s+/).map(part).join('\\s+'),'i');
}
function hl(sentence,w){
  const m=wordRe(w).exec(sentence);
  if(!m)return esc(sentence);
  return esc(sentence.slice(0,m.index))+'<mark>'+esc(m[0])+'</mark>'+esc(sentence.slice(m.index+m[0].length));
}

async function gt(text,bd){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&hl=en&dt=t'+(bd?'&dt=bd&dt=md':'')+'&q='+encodeURIComponent(text));
  if(!r.ok)throw new Error('gt '+r.status);
  const j=await r.json();
  return {t:(j[0]||[]).map(x=>x&&x[0]||'').join('').trim(),bd:(j[1]||[]).map(p=>({p:p[0],z:(p[1]||[]).slice(0,5)})),
    md:(j[12]||[]).map(p=>({p:p[0],d:(p[1]||[]).slice(0,2).map(x=>({e:String(x[0]||'').replace(/^./,c=>c.toUpperCase()),z:''})).filter(x=>x.e)})).filter(g=>g.p&&g.d.length).slice(0,5)};
}
const gwCache={};
function gword(word){const k=word.toLowerCase();return gwCache[k]||(gwCache[k]=gt(k,true).catch(e=>{delete gwCache[k];return null}))}
const ABBR={noun:'n.',verb:'v.',adjective:'adj.',adverb:'adv.',preposition:'prep.',conjunction:'conj.',pronoun:'pron.',interjection:'int.',abbreviation:'abbr.'};
async function cnFull(word){
  const [yd,g]=await Promise.all([ydExplain(word),/\s/.test(word)?null:gword(word)]);
  const lines=yd?yd.split(/;\s+/).filter(Boolean):[];
  if(g)g.bd.forEach(x=>{const ab=ABBR[x.p];if(ab&&x.z.length&&!lines.some(l=>l.indexOf(ab)===0))lines.push(ab+' '+x.z.join('；'))});
  if(!lines.length&&g&&g.t&&g.t.toLowerCase()!==word.toLowerCase())lines.push(g.t);
  return lines.join('; ');
}
async function trDefs(defs){
  const todo=[];defs.forEach(g=>g.d.forEach(x=>{if(!x.z)todo.push(x)}));
  if(!todo.length)return false;
  try{const out=(await gt(todo.map(x=>x.e.replace(/\n/g,' ')).join('\n'))).t.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(out.length!==todo.length)return false;
    todo.forEach((x,i)=>{x.z=out[i]});return true}catch(e){return false}
}
function ydExplain(word){
  return new Promise(res=>{
    const cb='__yd'+(++ydN),sc=document.createElement('script');let fin=false;
    const done=v=>{if(fin)return;fin=true;try{delete window[cb]}catch(e){}sc.remove();res(v)};
    window[cb]=j=>{const e=j&&j.data&&j.data.entries&&j.data.entries[0];
      done(e&&e.entry&&e.explain&&String(e.entry).toLowerCase()===word.toLowerCase()?ydTrim(String(e.explain)):'')};
    sc.onerror=()=>done('');setTimeout(()=>done(''),6000);
    sc.src='https://dict.youdao.com/suggest?num=1&doctype=json&q='+encodeURIComponent(word)+'&callback='+cb;
    document.head.appendChild(sc);
  });
}
async function fetchDefs(word){
  const key=word.toLowerCase();if(defCache[key])return defCache[key];
  if(!/\s/.test(key)){const g=await gword(key);if(g&&g.md.length)return defCache[key]=g.md}
  const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key));
  if(r.status===404)return defCache[key]=[];
  if(!r.ok)throw new Error('dict '+r.status);
  const out=[];
  (await r.json()).forEach(en=>(en.meanings||[]).forEach(m=>{
    if(!m.partOfSpeech)return;
    let g=out.find(x=>x.p===m.partOfSpeech);
    if(!g){if(out.length>=5)return;out.push(g={p:m.partOfSpeech,d:[]})}
    (m.definitions||[]).forEach(x=>{if(x.definition&&g.d.length<2&&!g.d.some(y=>y.e===x.definition))g.d.push({e:x.definition,z:''})});
  }));
  return defCache[key]=out.filter(g=>g.d.length);
}

  const cn=w.cn?'<p class="small muted" style="margin:0">词典释义（所有词性）</p>'+w.cn.split(/;\s+/).map(x=>'<p class="cnl">'+esc(x)+'</p>').join(''):'';

    w.defs.map((g,gi)=>'<div class="pos"><span class="tag">'+esc(posName(g.p))+'</span><ol>'+g.d.map((x,di)=>

async function autoDefs(){
  for(const el of document.querySelectorAll('[data-defs]')){
    const k=el.dataset.defs,w=S.words[k];
    if(!w||w.cv===4||defTried[k])continue;
    defTried[k]=1;
    const [cn,d]=await Promise.all([cnFull(w.w).catch(()=>''),fetchDefs(w.w).catch(()=>null)]);
    const dd=d?JSON.parse(JSON.stringify(d)):null;
    if(dd)await trDefs(dd);
    const cur=S.words[k];
    if(cur){if(cn)cur.cn=cn;if(dd)cur.defs=dd;if(cn&&dd)cur.cv=4;if(cn||dd)persist(k)}
    const now=document.querySelector('[data-defs="'+k+'"]');if(now)now.innerHTML=defsHTML(k);
  }
}

    '<div class="row small"><button class="btn ghost" data-act="editRel" data-k="'+k+'">＋ 补充释义 / 修改近义词、反义词</button></div>';

async function autoRel(){
  for(const el of document.querySelectorAll('[data-rel]')){
    const k=el.dataset.rel,w=S.words[k];
    if(!w||w.rel||relTried[k]||/\s/.test(w.w)||w.src==='talk'||w.src==='chem')continue;
    relTried[k]=1;
    try{
      const dm=q=>fetch('https://api.datamuse.com/words?md=f&'+q+encodeURIComponent(w.w)).then(x=>x.ok?x.json():Promise.reject());
      const fq=x=>{const t=(x.tags||[]).find(t=>t.indexOf('f:')===0);return t?+t.slice(2):0};
      const ok=x=>x.word&&!/\s/.test(x.word)&&x.word.toLowerCase()!==w.w.toLowerCase();
      const [ml,an]=await Promise.all([dm('max=60&ml='),dm('max=30&rel_ant=')]);
      const syn=ml.filter(x=>ok(x)&&(x.tags||[]).indexOf('syn')>=0&&fq(x)>=2).map(x=>x.word);
      const ant=an.filter(x=>ok(x)&&fq(x)>=1).sort((a,b)=>fq(b)-fq(a)).map(x=>x.word);
      const cur=S.words[k];if(!cur||cur.rel)continue;
      cur.syn=syn.slice(0,4);cur.ant=ant.slice(0,3);cur.rel=1;persist(k);
    }catch(e){}
    const now=document.querySelector('[data-rel="'+k+'"]');
    if(now&&ui.editRel!==k)now.innerHTML=relHTML(k);
  }
}

function testAnswer(v){

  for(let L=0;L<6;L++){const n=t.q.filter((x,i)=>x.lv===L&&t.ok[i]).length;if(n<9){level=L;break}}

  m.pending=t.q.filter((x,i)=>!t.ok[i]&&x.lv<=level&&!S.words[slug(x.w)]).map(x=>x.w);
  ui.test=null;persist('meta');render();ensureToday();

/* review */
function makeQ(k,retry){
  const w=S.words[k];
  let type=retry?'spell':(w.box===0?'mc':(Math.random()<.5?'cloze':'spell'));
  const q={k:k,type:type,done:null};
  if(type==='cloze'){
    const re=wordRe(w.w),c=shuffle(w.ex).find(e=>re.test(e.en));
    if(c){const m=re.exec(c.en);q.ex=c;q.pre=c.en.slice(0,m.index);q.post=c.en.slice(m.index+m[0].length);q.ans=m[0]}else q.type='spell';
  }
  if(q.type==='mc'){
    const pool=Array.from(new Set(all().filter(x=>x!==k).map(x=>S.words[x].zh).concat(PT.map(x=>x[2])))).filter(z=>z!==w.zh);
    q.opts=shuffle([w.zh].concat(shuffle(pool).slice(0,3)));
  }
  return q;
}
function startReview(free){
  let q=dueList().slice(0,20);
  if(free)q=shuffle(all()).slice(0,10);
  if(!q.length)return;
  ui.rev={q:q,n0:q.length,i:0,retried:[],right:0,missed:[],cur:null};
  ui.rev.cur=makeQ(q[0],false);render();
}
function grade(ok,given){
  const r=ui.rev,q=r.cur,w=S.words[q.k],t=today(),retry=r.retried.indexOf(q.k)>=0;
  q.done={ok:ok,given:given};
  if(!retry){
    if(ok){r.right++;if(w.due<=t){w.box=Math.min(w.box+1,6);w.due=addDays(t,GAP[w.box-1])}}
    else fail(q.k);
    persist(q.k);
  }
  render();
}
function fail(k){ // not understood yet: back to the start, and it stays due so the next test asks it again
  const r=ui.rev,w=S.words[k];
  w.box=0;w.due=today();w.lapses=(w.lapses||0)+1;
  if(r.retried.indexOf(k)<0){r.retried.push(k);r.q.push(k);r.missed.push(k)}
}
function nextQ(){
  const r=ui.rev;r.i++;
  r.cur=r.i<r.q.length?makeQ(r.q[r.i],r.i>=r.n0):null;
  render();
}

  return '<section class="panel"><div class="row spread"><h2>复习</h2><span class="muted small">'+(r.i+1)+' / '+r.q.length+'</span></div>'+

  saveRel(d){const k=(d&&d.k)||ui.editRel,w=S.words[k];if(!w)return;
    w.more=$('#rel-more').value.trim();w.syn=splitList($('#rel-syn').value);w.ant=splitList($('#rel-ant').value);w.rel=1;
    ui.editRel=null;persist(k);const el=document.querySelector('[data-rel="'+k+'"]');if(el)el.innerHTML=relHTML(k)},
  toggleSync(){ui.showSync=!ui.showSync;ui.linkMsg='';const a=document.activeElement;if(a&&a.blur)a.blur();renderSync()},
  copyLink(){const u=location.origin+location.pathname+'#t='+syncCfg.token;
    const done=ok=>{ui.linkMsg=ok?'已复制，发给自己后在另一台设备上打开':'复制失败，请换个浏览器再试';renderSync()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>done(true),()=>done(false));
    else{const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();done(ok)}},
  saveSync(){const el=$('#sync-token'),v=el&&el.value.trim();if(!v)return;el.blur();ui.syncBad=false;ui.sync='';
    syncCfg={token:v};try{localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg))}catch(e){}
    ui.showSync=false;render();syncNow().then(()=>{if(!ui.rev&&!ui.test){render();ensureToday()}})},
  syncNow(){syncNow()},
  stopSync(){syncCfg=null;try{localStorage.removeItem(SYNC_KEY)}catch(e){}setSync('同步已关闭');render()},
  exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='daily-ten-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()},
  importData(){const el=$('#imp');if(el)el.click()}
};
document.addEventListener('change',e=>{
  if(e.target.id!=='imp'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{const l=JSON.parse(fr.result);if(!l.meta||!l.words)throw 0;S={meta:Object.assign({},DEF,l.meta),words:l.words};persist();ui.sync='已导入备份';render()}catch(x){ui.sync='这个文件不是有效的备份';render()}};
  fr.readAsText(e.target.files[0]);
});
const C={
  level(v){S.meta.level=+v;persist('meta');render()},
  ratio(v){S.meta.lifeN=+v;persist('meta')},
  pracSet(v){const p=ui.prac;p.custom=null;p.set=v;p.i=0;p.ex=0;resetPrac();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&A[b.dataset.act])A[b.dataset.act](b.dataset)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&C[k])C[k](e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const el=e.target;
  if(el.id==='typer-in'){e.preventDefault();pracNext();return}
  const k=el.dataset&&el.dataset.enter;if(k&&A[k]){e.preventDefault();A[k]({})}
});
document.addEventListener('input',e=>{
  const el=e.target,p=ui.prac;
  if(el.id==='typer-in'){
    const t=pracTarget();if(!t)return;
    p.typed=el.value;
    $('#typer-out').innerHTML=typerHTML(t.target,p.typed,p.mode==='spell'&&!p.hint);
    p.done=norm(p.typed)===norm(t.target);
    $('#typer-done').hidden=!p.done;
  }else if(el.id==='make-in')p.typed=el.value;
});
boot();
})();
</script>
